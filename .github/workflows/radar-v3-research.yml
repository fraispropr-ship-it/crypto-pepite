name: Radar V3 research benchmark
on:
  push:
    branches: [research/radar-alt-v3]
    paths:
      - radar_v3_**
      - tests/test_radar_v3.py
      - .github/workflows/radar-v3-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile radar_v3_strategies.py radar_v3_benchmark.py
      - run: python -m unittest discover -s tests -p 'test_radar_v3.py' -v
      - run: python -u radar_v3_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-benchmark
          path: radar_v3_benchmark.json

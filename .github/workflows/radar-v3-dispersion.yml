name: Radar V3.8 dispersion earlier-period test
on:
  push:
    branches: [research/radar-alt-v3]
    paths: [radar_v3_dispersion_validation.py, .github/workflows/radar-v3-dispersion.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u radar_v3_dispersion_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-dispersion-validation
          path: radar_v3_dispersion_validation.json

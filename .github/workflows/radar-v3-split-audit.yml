name: Radar V3 chronology and selection audit
on:
  push:
    branches: [research/radar-alt-v3]
    paths:
      - radar_v3_split_audit.py
      - .github/workflows/radar-v3-split-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u radar_v3_benchmark.py
      - run: python -u radar_v3_split_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-chronology-audit
          path: |
            radar_v3_audit_report.json
            radar_v3_benchmark.json

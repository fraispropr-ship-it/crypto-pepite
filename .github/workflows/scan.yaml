name: Crypto Pepite scan

on:
  workflow_dispatch:            # lancé par cron-job.org (h26 / h56, 7h-23h Paris)

permissions:
  contents: write               # autorise l'enregistrement du journal dans le dépôt

concurrency:
  group: pepite-scan
  cancel-in-progress: false     # jamais deux scans en même temps

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mémoire des signaux déjà envoyés (anti-doublon entre deux scans)
      - name: Restaurer la mémoire des signaux
        uses: actions/cache/restore@v4
        with:
          path: etat_signaux.json
          key: etat-signaux-${{ github.run_id }}
          restore-keys: etat-signaux-

      # Météo à la demande : envoyée si tu as écrit « meteo » sur Telegram depuis le dernier scan
      - name: Météo à la demande
        continue-on-error: true       # un souci de météo ne bloque jamais le scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python meteo.py --si-demande

      - name: Lancer le scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_pepite.py

      - name: Sauver la mémoire des signaux
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat_signaux.json
          key: etat-signaux-${{ github.run_id }}

      # Journal : enregistré dans le dépôt seulement s'il a changé
      - name: Enregistrer le journal
        if: always()
        run: |
          git config user.name "pepite-bot"
          git config user.email "pepite-bot@users.noreply.github.com"
          git add journal_signaux.csv journal_stats.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Journal inchangé"
          else
            git commit -m "Journal $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

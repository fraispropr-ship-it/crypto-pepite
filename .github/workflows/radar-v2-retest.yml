name: Radar V2 M15 retest research
on:
  push:
    branches: [feature/radar-alt-v2]
    paths: [radar_v2_retest.py, .github/workflows/radar-v2-retest.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u radar_v2_retest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v2-retest-results
          path: radar_v2_retest_report.json

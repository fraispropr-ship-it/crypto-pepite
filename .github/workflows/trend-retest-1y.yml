name: Trend Retest one-year backtest
on:
  push:
    branches: [research/trend-retest-one-year]
    paths: [trend_retest_1y.py, .github/workflows/trend-retest-1y.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u trend_retest_1y.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-retest-one-year
          path: trend_retest_1y_report.json

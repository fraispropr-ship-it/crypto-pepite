name: Radar V3.7 global market research
on:
  push:
    branches: [research/radar-alt-v3]
    paths: [radar_v3_global.py, .github/workflows/radar-v3-global.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile radar_v3_global.py
      - run: python -u radar_v3_global.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-global-report
          path: radar_v3_global_report.json

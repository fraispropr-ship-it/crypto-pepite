name: Radar V3.1 BTC regime experiment
on:
  push:
    branches: [research/radar-alt-v3]
    paths:
      - radar_v3_btc_regime.py
      - tests/test_radar_v3_btc_regime.py
      - .github/workflows/radar-v3-btc-regime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_radar_v3_btc_regime.py' -v
      - run: python -u radar_v3_btc_regime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-btc-regime-report
          path: radar_v3_btc_regime_report.json

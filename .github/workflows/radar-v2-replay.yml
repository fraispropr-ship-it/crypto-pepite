name: Radar V2 historical replay
on:
  push:
    branches: [feature/radar-alt-v2]
    paths:
      - radar_v2_replay.py
      - .github/workflows/radar-v2-replay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Replay historical Zoomex candles
        run: python -u radar_v2_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v2-replay-report
          path: radar_v2_replay_report.json

name: Crypto Pepite scan

on:
  workflow_dispatch:            # lancé par cron-job.org (h26 / h56, 7h-23h Paris)

concurrency:
  group: pepite-scan
  cancel-in-progress: false     # jamais deux scans en même temps

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mémoire des signaux déjà envoyés (anti-doublon entre deux scans)
      - name: Restaurer la mémoire des signaux
        uses: actions/cache/restore@v4
        with:
          path: etat_signaux.json
          key: etat-signaux-${{ github.run_id }}
          restore-keys: etat-signaux-

      - name: Lancer le scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_pepite.py

      - name: Sauver la mémoire des signaux
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat_signaux.json
          key: etat-signaux-${{ github.run_id }}

name: Trend Retest 40 dry test
on:
  push:
    branches: [research/trend-retest-40-test]
    paths: [trend_retest_40_test.py, .github/workflows/trend-retest-40-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test40:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u trend_retest_40_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-retest-40-dry-report
          path: trend_retest_40_report.json
